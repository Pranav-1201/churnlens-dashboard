name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC — slow end-to-end train test

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run fast test suite
        run: pytest -q --cov=churn_intel

  slow:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run end-to-end train test
        run: pytest -q -m slow

  docker:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile --build-arg GIT_SHA=${GITHUB_SHA::7} -t churnlens-backend:ci .

      - name: Smoke-test backend container
        run: |
          docker run -d --name churnlens-backend -p 8000:8000 churnlens-backend:ci
          ok=""
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /tmp/health.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs churnlens-backend; exit 1; fi
          cat /tmp/health.json
          commit=$(jq -r '.app_git_commit' /tmp/health.json)
          if [ "$commit" = "unknown" ] || [ -z "$commit" ]; then
            echo "app_git_commit was not baked into the image (got: $commit)"; exit 1
          fi
          docker stop churnlens-backend

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend --build-arg VITE_API_BASE_URL=http://localhost:8000 -t churnlens-frontend:ci .

      - name: Smoke-test frontend container
        run: |
          docker run -d --name churnlens-frontend -p 8080:80 churnlens-frontend:ci
          ok=""
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/ > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs churnlens-frontend; exit 1; fi
          docker stop churnlens-frontend

  catboost-thread-check:
    # Phase 6.2: re-test the CatBoost background-thread deadlock (previously
    # only observed on Windows — see backend/seed_demo_run.py's docstring)
    # against Linux, the actual deploy target. See
    # backend/diagnostics/catboost_thread_check.py for what this does and why.
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CatBoost background-thread check (60s timeout)
        run: python backend/diagnostics/catboost_thread_check.py

  frontend:
    # Roadmap C1: the dashboard's lint, type check, unit tests and production build
    # were previously never run in CI (only inside the Docker build, which skips them).
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint first-party sources
        # Scoped to src/: a root-level lint also walks vendored directories.
        run: npx eslint src

      - name: Type check (and prove it compiled real files)
        run: |
          npx tsc -p tsconfig.app.json --noEmit --listFiles > /tmp/tsc-files.txt
          n=$(grep -vc node_modules /tmp/tsc-files.txt)
          echo "first-party files compiled: $n"
          test "$n" -gt 50

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  audit:
    # Roadmap C2. Informational for now: the first run found high/critical advisories that need
    # triage (see DEPLOYMENT.md, section 6). Remove continue-on-error once they are resolved.
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (high and above)
        run: npm audit --audit-level=high

      - name: pip-audit (runtime requirements)
        if: always()
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
